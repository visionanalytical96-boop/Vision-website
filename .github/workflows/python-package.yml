# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
#
# Scoped to vision-website-deploy/ (the only Python project in this repo) so
# it doesn't lint/test unrelated Python code elsewhere (e.g.
# packages/@n8n/task-runner-python, which targets newer Python versions than
# this workflow's matrix and has its own CI in ci-python.yml).

name: Python package

on:
  push:
    branches: [ "master" ]
    paths:
      - 'vision-website-deploy/**'
      - 'requirements.txt'
      - '.github/workflows/python-package.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'vision-website-deploy/**'
      - 'requirements.txt'
      - '.github/workflows/python-package.yml'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 vision-website-deploy --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 vision-website-deploy --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest vision-website-deploy
