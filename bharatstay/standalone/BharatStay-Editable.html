<!DOCTYPE html>
<!-- ================================================================
  BHARATSTAY — EDITABLE VERSION
  =================================================================
  KAISE EDIT KAREIN (bahut aasaan):
  1. Is file ko Notepad / kisi bhi text editor mein kholo.
  2. Neeche <script> ke andar "EDIT ZONE" dhundo (Ctrl+F se
     "EDIT ZONE" search karo).
  3. Wahan har cheez Hindi comments ke saath samjhayi gayi hai —
     apna naam, phone, price, jagah, plan... jo badalna hai badlo.
  4. File SAVE karo (Ctrl+S) aur browser mein REFRESH karo (F5).
     Bas! Changes turant dikh jayenge.

  ZAROORI NIYAM:
  - Sirf quotes ' ' ke ANDAR ka text badlo. Quotes, commas [ ] { }
    ko mat hatao, warna page blank ho jayega.
  - Agar page blank ho jaye to last change wapas karke save karo.
  - Price mein sirf number likho (jaise 4999), ₹ ya comma nahi.
================================================================ -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatStay — India's Complete Travel Booking Platform</title>
<meta name="description" content="Book hotels, resorts, villas, homestays, farm-stays, flights, buses, cabs and holiday packages across India with BharatStay. Explore India. Stay Your Way.">
<style>
/* ============ BharatStay single-file app ============ */
:root{
  --r900:#0b132e;--r800:#101c44;--r700:#16265a;--r600:#1c2f6b;--r500:#2c48ac;--r400:#4f6fca;
  --r300:#7f9cdd;--r200:#aec1eb;--r100:#d6e0f5;--r50:#eef2fb;
  --s700:#b34c0a;--s600:#d9640f;--s500:#f47e1e;--s400:#ff9d29;--s300:#ffb454;--s100:#ffe8c4;--s50:#fff6ea;
  --g700:#146842;--g600:#188050;--g500:#1f9d63;--g100:#d3f5e0;--g50:#eefbf3;
  --muted:#f5f6fa;--border:#e6e8f0;--red:#dc2626;--red50:#fef2f2;
  --shadow:0 2px 10px rgba(11,19,46,.06);--shadow-lg:0 10px 30px rgba(11,19,46,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;color:var(--r900);background:#fff;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
img{max-width:100%}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
h1,h2,h3{line-height:1.25}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;transition:.15s;white-space:nowrap}
.btn-p{background:var(--s500);color:#fff;box-shadow:var(--shadow)}
.btn-p:hover{background:var(--s600)}
.btn-s{background:#fff;color:var(--r700);border:1px solid var(--r200)}
.btn-s:hover{background:var(--r50)}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:8px}
.btn-g{background:var(--g500);color:#fff}.btn-g:hover{background:var(--g600)}
.btn-r{background:var(--red);color:#fff}
.btn-blue{background:var(--r700);color:#fff}.btn-blue:hover{background:var(--r800)}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* forms */
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--r500);margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--r900);background:#fff;outline:none}
.field input:focus,.field select:focus{border-color:var(--r400);box-shadow:0 0 0 3px var(--r100)}

/* cards & badges */
.card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);transition:.15s}
.card:hover{box-shadow:var(--shadow-lg)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700}
.bg-g{background:var(--g50);color:var(--g700)}.bg-b{background:var(--r50);color:var(--r700)}
.bg-o{background:var(--s50);color:var(--s700)}.bg-r{background:var(--red50);color:var(--red)}
.eyebrow{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--s600)}
.sec-title{font-size:26px;font-weight:800;margin-top:4px}
.pill{border:1px solid var(--border);border-radius:99px;padding:7px 16px;font-size:13px;font-weight:600;color:var(--r600);transition:.15s}
.pill.on{background:var(--r700);border-color:var(--r700);color:#fff}

/* header */
.topbar{background:var(--r800);color:#fff;font-size:12px}
.topbar .container{display:flex;justify-content:space-between;align-items:center;height:34px}
.topbar a{margin-right:16px;opacity:.9}.topbar a:hover{color:var(--s300)}
.topbar select{background:transparent;color:#fff;border:none;font-size:12px;outline:none}
.topbar select option{color:var(--r900)}
header.main{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
header.main .container{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.logo{display:flex;align-items:center;gap:9px}
.logo .mark{width:36px;height:36px;border-radius:10px;background:var(--r700);display:flex;align-items:center;justify-content:center;font-size:18px}
.logo .name{font-size:19px;font-weight:800;color:var(--r800)}
.logo .name span{color:var(--s500)}
.logo small{display:block;font-size:8.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--r400)}
nav.links{display:flex;gap:2px;flex-wrap:wrap}
nav.links a{padding:8px 11px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--r700)}
nav.links a:hover,nav.links a.on{background:var(--r50)}
nav.links a.on{font-weight:700}
.hdr-actions{display:flex;gap:8px;align-items:center}
@media(max-width:1000px){nav.links{display:none}.hdr-actions .btn-s{display:none}}

/* hero */
.hero{background:linear-gradient(135deg,var(--r900),var(--r800) 55%,var(--r700));color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:var(--s500);opacity:.16;filter:blur(90px);top:-140px;left:-120px}
.hero::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:var(--g500);opacity:.14;filter:blur(90px);bottom:-160px;right:-60px}
.hero .container{position:relative;padding:56px 20px 64px;z-index:1}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.5px;margin-top:6px}
.hero p.sub{color:var(--r100);margin-top:10px;max-width:560px}
.searchbox{background:#fff;color:var(--r900);border-radius:18px;box-shadow:var(--shadow-lg);margin-top:30px;overflow:hidden}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border)}
.tabs button{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:14px 20px;font-size:14px;font-weight:600;color:var(--r300);border-bottom:2.5px solid transparent}
.tabs button.on{color:var(--r900);border-bottom-color:var(--s500)}
.sform{padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sform .span2{grid-column:span 2}.sform .span4{grid-column:span 4}
@media(max-width:820px){.sform{grid-template-columns:repeat(2,1fr)}.sform .span2,.sform .span4{grid-column:span 2}}
@media(max-width:480px){.sform{grid-template-columns:1fr}.sform .span2,.sform .span4{grid-column:span 1}}

/* section layouts */
.section{padding:52px 0}
.section.alt{background:var(--muted)}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1000px){.g4,.g5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.g3,.g4,.g5{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}

/* placeholder imgs */
.ph{position:relative;display:flex;align-items:flex-end;overflow:hidden;border-radius:0}
.ph .emoji{position:absolute;top:10px;right:12px;font-size:30px;opacity:.85}
.ph .lbl{width:100%;padding:8px 12px;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.62))}
.t-ocean{background:linear-gradient(135deg,#0ea5e9,#1d4ed8)}
.t-sunset{background:linear-gradient(135deg,#fb923c,#db2777)}
.t-forest{background:linear-gradient(135deg,#10b981,#0f766e)}
.t-mountain{background:linear-gradient(135deg,#64748b,#4338ca)}
.t-royal{background:linear-gradient(135deg,#1c2f6b,#0b132e)}
.t-saffron{background:linear-gradient(135deg,#ff9d29,#b34c0a)}
.t-heritage{background:linear-gradient(135deg,#f59e0b,#be123c)}
.t-desert{background:linear-gradient(135deg,#eab308,#c2410c)}
.t-snow{background:linear-gradient(135deg,#22d3ee,#1e40af)}
.t-gold{background:linear-gradient(135deg,#facc15,#b45309)}
.t-lake{background:linear-gradient(135deg,#2dd4bf,#155e75)}
.t-farm{background:linear-gradient(135deg,#84cc16,#166534)}

/* listing page */
.listing{display:grid;grid-template-columns:270px 1fr;gap:24px;align-items:start}
@media(max-width:900px){.listing{grid-template-columns:1fr}}
.fbox{padding:18px;position:sticky;top:80px}
.fbox h4{font-size:13px;font-weight:800;margin-bottom:10px}
.fgroup{margin-bottom:18px}
.fgroup .field label{margin-bottom:7px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--r700);padding:3px 0;cursor:pointer}
.check input{width:15px;height:15px;accent-color:var(--r700)}
.hrow{display:flex;gap:0;overflow:hidden}
.hrow .ph{width:230px;min-height:185px;flex-shrink:0}
@media(max-width:640px){.hrow{flex-direction:column}.hrow .ph{width:100%;height:160px}}
.hbody{flex:1;padding:16px;display:flex;flex-direction:column}
.rating-chip{background:var(--r700);color:#fff;border-radius:8px;padding:4px 9px;font-size:13px;font-weight:700}
.amen{background:var(--r50);color:var(--r600);border-radius:99px;padding:3px 9px;font-size:11px}
.strike{color:var(--r300);text-decoration:line-through;font-size:12px}
.price-lg{font-size:21px;font-weight:800}
.sortbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between;margin-bottom:18px}

/* detail */
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:150px 150px;gap:8px}
.gallery .ph{border-radius:14px}
.gallery .ph:first-child{grid-row:span 2}
@media(max-width:700px){.gallery{grid-template-columns:1fr;grid-template-rows:220px}.gallery .ph:not(:first-child){display:none}}
.detail{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
@media(max-width:900px){.detail{grid-template-columns:1fr}}
.bookbox{position:sticky;top:80px;padding:20px}
.room-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:#fff}
.room-opt.on{border-color:var(--r700);background:var(--r50)}
.prow{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:var(--r600)}
.prow.total{border-top:1px solid var(--border);margin-top:6px;padding-top:9px;font-weight:800;font-size:16px;color:var(--r900)}
details.faq{border-bottom:1px solid var(--border);padding:13px 4px}
details.faq summary{cursor:pointer;font-weight:600;font-size:14px}
details.faq p{margin-top:8px;font-size:13.5px;color:var(--r500)}

/* checkout */
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.step{display:flex;align-items:center;gap:7px;border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:600;background:var(--muted);color:var(--r300)}
.step.on{background:var(--r700);color:#fff}
.step.done{background:var(--g50);color:var(--g700)}
.pay-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.pay-grid{grid-template-columns:repeat(2,1fr)}}
.pay-opt{display:flex;flex-direction:column;align-items:center;gap:5px;border:1.5px solid var(--border);border-radius:12px;padding:14px 8px;font-size:12px;font-weight:600;color:var(--r600)}
.pay-opt.on{border-color:var(--r700);background:var(--r50);color:var(--r900)}

/* tables */
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--r400);padding:11px 12px;border-bottom:1px solid var(--border)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--border)}
.tbl tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto}

/* dashboard */
.dash{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
@media(max-width:860px){.dash{grid-template-columns:1fr}}
.dnav{padding:10px}
.dnav a{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:10px;font-size:14px;font-weight:500;color:var(--r600)}
.dnav a.on{background:var(--r700);color:#fff;font-weight:600}
.dnav a:not(.on):hover{background:var(--r50)}
.stat{padding:16px}
.stat .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--r400)}
.stat .v{font-size:23px;font-weight:800;margin-top:3px}
.bar-outer{height:8px;border-radius:99px;background:var(--r50);margin-top:5px}
.bar-inner{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--r600),var(--s500))}

/* voucher */
.voucher{max-width:760px;margin:0 auto;padding:30px;border:1px solid var(--border);border-radius:18px;background:#fff;box-shadow:var(--shadow)}
.vrow{display:flex;justify-content:space-between;gap:14px;padding:7px 2px;border-bottom:1px solid var(--muted);font-size:14px}
.vrow span:first-child{color:var(--r400)}
.vrow span:last-child{font-weight:600;text-align:right}
.vsec{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:var(--r400);margin:20px 0 6px}
.qr{width:86px;height:86px;border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:38px;color:var(--r800)}

/* footer */
footer{background:var(--r900);color:var(--r100);margin-top:40px}
footer .cols{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:26px;padding:44px 0}
@media(max-width:900px){footer .cols{grid-template-columns:repeat(2,1fr)}}
footer h5{color:#fff;font-size:13.5px;margin-bottom:12px}
footer a{display:block;font-size:13px;color:var(--r300);padding:3px 0}
footer a:hover{color:var(--s300)}
footer .base{border-top:1px solid var(--r800);padding:14px 0;font-size:12px;color:var(--r400);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* toast + misc */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--r800);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.3s;z-index:99}
#toast.show{opacity:1}
#toTop{position:fixed;bottom:24px;right:22px;width:44px;height:44px;border-radius:50%;background:var(--r800);color:#fff;font-size:18px;box-shadow:var(--shadow-lg);display:none;z-index:60}
.center-note{padding:60px 20px;text-align:center;color:var(--r400)}
.review-card{max-width:620px;margin:0 auto;background:rgba(255,255,255,.07);border-radius:18px;padding:28px}
.stars{color:var(--s300);letter-spacing:2px}
.auth-wrap{max-width:400px;margin:44px auto;padding:0 20px}
.seg{display:flex;background:var(--muted);border-radius:11px;padding:4px;margin-bottom:18px}
.seg button{flex:1;padding:9px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--r400)}
.seg button.on{background:#fff;color:var(--r900);box-shadow:var(--shadow)}
@media print{
  .topbar,header.main,footer,.no-print,#toTop{display:none!important}
  .voucher{border:none;box-shadow:none}
  body{background:#fff}
}
</style>
</head>

<div id="app"></div>
<div id="toast"></div>

<script>
/* ================================================================
   ============  EDIT ZONE — YAHAN SE EDIT KARO  ==================
   ================================================================
   Neeche saari settings aur data hai. Har section ke upar Hindi
   mein likha hai ki kya badal sakte ho.
   ================================================================ */

/* --- 1) BUSINESS KI JAANKARI (naam, phone, email...) ------------ */
const SETTINGS = {
  brandA: 'Bharat',            // Naam ka pehla hissa (neela dikhega)
  brandB: 'Stay',              // Naam ka doosra hissa (orange dikhega)
  taglineShort: 'Explore India, Stay Your Way',   // Logo ke neeche ki line
  phone: '1800-123-4567',      // Support phone number
  email: 'support@bharatstay.example',            // Support email
  gstin: '27ABCDE1234F1Z5',    // GST number (receipt par dikhega)

  city: 'Mumbai, India',       // Footer mein address
};
/* ================= DATA ================= */
const INR = n => '₹' + Math.round(n).toLocaleString('en-IN');
const TONES = ['ocean','sunset','forest','mountain','royal','saffron','heritage','desert','snow','gold','lake','farm'];

/* --- 2) DESTINATIONS (sheher ke cards) --------------------------
   Har line ek sheher hai: ['Naam','Rajya','rang','emoji',shuruaati-price,kitne-hotels,'chhota-sa-vivaran']
   rang options: ocean sunset forest mountain royal saffron heritage desert snow gold lake farm */
const DESTS = [
 ['Goa','Goa','ocean','🏖️',2499,412,'Beaches, nightlife and Portuguese heritage.'],
 ['Manali','Himachal','snow','🏔️',1899,268,'Snow peaks, adventure and cosy stays.'],
 ['Shimla','Himachal','mountain','🚂',1699,231,'Colonial charm in the Himalayan foothills.'],
 ['Jaipur','Rajasthan','desert','🏰',1599,356,'The Pink City — forts and bazaars.'],
 ['Udaipur','Rajasthan','lake','🛶',2199,198,'City of Lakes and royal palaces.'],
 ['Kerala','Kerala','forest','🌴',2899,302,'Backwaters, houseboats, tea gardens.'],
 ['Mumbai','Maharashtra','royal','🌆',2299,589,'The City of Dreams by the sea.'],
 ['Delhi','Delhi','heritage','🕌',1799,641,'History and heritage monuments.'],
 ['Agra','UP','gold','🕌',1499,187,'Home of the Taj Mahal.'],
 ['Kashmir','J&K','snow','🌸',3499,156,'Dal Lake, houseboats, alpine valleys.'],
 ['Ladakh','Ladakh','mountain','🏍️',3999,94,'High-altitude desert and road trips.'],
 ['Andaman','A&N','ocean','🐠',4499,78,'Turquoise waters and coral reefs.'],
 ['Rishikesh','Uttarakhand','forest','🧘',1299,143,'Yoga capital on the Ganges.'],
 ['Lonavala','Maharashtra','forest','🌧️',1399,176,'Monsoon getaway with waterfalls.'],
 ['Mahabaleshwar','Maharashtra','farm','🍓',1599,129,'Strawberry farms and viewpoints.'],
].map((d,i)=>({id:'d'+i,name:d[0],state:d[1],tone:d[2],emoji:d[3],price:d[4],count:d[5],desc:d[6]}));

/* --- 3) OFFERS (coupon cards) -----------------------------------
   Har line: ['Title','COUPONCODE','discount-label','category','vivaran','rang','emoji'] */
const OFFERS = [
 ['Flat 25% off on Hotels','STAY25','25% OFF','Hotels','On bookings above ₹3,000.', 'royal','🏨'],
 ['₹500 off Flight Bookings','FLY500','₹500 OFF','Flights','Domestic flights, min fare ₹4,000.','ocean','✈️'],
 ['15% off Bus Tickets','BUS15','15% OFF','Buses','AC Sleeper and Volvo buses.','saffron','🚌'],
 ['Weekend Stays from ₹1,999','WEEKEND','₹1,999+','Hotels','Handpicked weekend resorts.','forest','🌿'],
 ['First Booking — 30% off','WELCOME30','30% OFF','New Users','Exclusive for new users.','gold','🎉'],
 ['10% Instant UPI Discount','UPI10','10% OFF','UPI','All bookings paid via UPI.','royal','📱'],
 ['Diwali Holiday Packages','DIWALI2026','₹8,999+','Packages','Festive packages across India.','sunset','🪔'],
 ['Monsoon Getaways 20% off','MONSOON20','20% OFF','Packages','Lonavala, Munnar & Coorg.','forest','🌧️'],
];

const AMEN_POOL=['Free Wi-Fi','Swimming Pool','Air Conditioning','Parking','Restaurant','Spa','Gym','Room Service','Power Backup','Pet Friendly'];
/* --- 4) HOTELS / STAYS ------------------------------------------
   Har line: ['Hotel ka naam','Type','Sheher',star(3-5),price-per-night,'rang','room ka naam','khana']
   Type options: Hotel, Resort, Villa, Homestay, Farm Stay
   Naya hotel jodne ke liye ek nayi line copy-paste karke badlo. */
const HSEEDS = [
 ['Royal Orchid Suites','Hotel','Goa',5,8500,'ocean','Deluxe Sea View','Breakfast Included'],
 ['Taj Heritage Palace','Hotel','Jaipur',5,9200,'heritage','Heritage Room','Breakfast & Dinner'],
 ['BharatStay Grand Central','Hotel','Mumbai',4,6800,'royal','Executive Room','Breakfast Included'],
 ['Lakeview Residency','Hotel','Udaipur',4,5400,'lake','Lake Facing Room','Breakfast Included'],

/* State-driven routing: sandboxed iframes (e.g. artifact hosts) may block
   location.hash writes, so the hash is only a best-effort mirror. */

function go(route){

}

/* ================= HOTELS ================= */
function hotelsFiltered(){
  const f=S.filters;
  let list = HOTELS.filter(h=>{
    if(f.q && !(h.city+' '+h.name+' '+h.type).toLowerCase().includes(f.q.toLowerCase())) return false;
    if(h.price>f.maxPrice) return false;
    if(f.stars.size && !f.stars.has(h.star)) return false;
    if(f.minRating && h.rating<f.minRating) return false;
    if(f.types.size && !f.types.has(h.type)) return false;
    if(f.amen.size && ![...f.amen].every(a=>h.amen.includes(a))) return false;
    if(f.freeCancel&&!h.freeCancel) return false;
    if(f.payAtHotel&&!h.payAtHotel) return false;
    if(f.couple&&!h.couple) return false;
    if(f.family&&!h.family) return false;
    return true;
  });
  const s=f.sort;
  if(s==='Price: Low to High')list.sort((a,b)=>a.price-b.price);
  else if(s==='Price: High to Low')list.sort((a,b)=>b.price-a.price);
  else if(s==='Top Rated')list.sort((a,b)=>b.rating-a.rating);
  else if(s==='Most Reviewed')list.sort((a,b)=>b.reviews-a.reviews);
  else if(s==='Distance')list.sort((a,b)=>a.dist-b.dist);
  else if(s==='Highest Discount')list.sort((a,b)=>b.disc-a.disc);
  return list;
}

function startCheckout(item){
  S.cart=item;
  S.co={step:0,guest:{title:'Mr',first:'',last:'',email:'',phone:''},addons:{},coupon:'',couponOn:false,gst:false,gstin:'',method:'UPI'};

function coTotals(){
  const base=S.cart?S.cart.amount:0;
  const add=ADDONS.reduce((s,a)=>s+(S.co.addons[a[0]]?a[2]:0),0);
  const disc=S.co.couponOn?Math.round(base*.05):0;
  const sub=base+add-disc;
  const gst=Math.round(sub*(S.co.gst?.18:.12));
  return {base,add,disc,gst,total:sub+gst};
}

      <button class="btn btn-p">${S.otpSent?'Verify & Log In':'Send OTP'}</button>
    </form>`}
    <div style="display:flex;align-items:center;gap:10px;margin:18px 0"><div style="flex:1;height:1px;background:var(--border)"></div><span style="font-size:12px;color:var(--r400)">or continue with</span><div style="flex:1;height:1px;background:var(--border)"></div></div>
    <div class="grid g3" style="gap:10px">

    <div style="text-align:center;font-size:13.5px;color:var(--r400);margin-top:18px">New to BharatStay? <a href="#/register" style="font-weight:700;color:var(--r700)">Create an account</a></div>

/* ================= ROUTER ================= */
function render(){
  const h=CURRENT||'#/';
  const [_,route,param]=h.match(/^#\/([^\/]*)\/?(.*)$/)||[,'',''];
  let html;
  switch(route){
    case '': html=homeView(); break;
    case 'hotels': html=hotelsView(); break;
    case 'hotel': html=hotelDetailView(param); break;
    case 'flights': html=flightsView(); break;
    case 'buses': html=busesView(); break;
    case 'cabs': html=cabsView(); break;
    case 'trains': html=trainsView(); break;
    case 'weekend': html=weekendView(); break;
    case 'packages': html=packagesView(); break;
    case 'activities': html=activitiesView(); break;
    case 'checkout': html=checkoutView(); break;
    case 'status': html=statusView(); break;
    case 'voucher': html=voucherView(); break;
    case 'receipt': html=receiptView(); break;
    case 'dashboard': html=dashboardView(); break;
    case 'admin': html=adminView(); break;
    case 'login': html=loginView(); break;
    case 'register': html=registerView(); break;
    case 'list-property': html=listPropertyView(); break;
    case 'support': html=supportView(); break;
    case 'about': html=simplePage('About BharatStay','BharatStay is India\'s complete travel booking platform — a demo application showcasing hotels, flights, buses, cabs and holiday packages in one place. "Explore India. Stay Your Way."'); break;
    case 'careers': html=simplePage('Careers','We\'re always looking for people who love travel and technology. (Demo page)'); break;
    case 'blog': html=simplePage('Travel Blog','Destination guides, travel tips and festival specials coming soon. (Demo page)'); break;
    case 'contact': html=simplePage('Contact Us','Email '+SETTINGS.email+' or call '+SETTINGS.phone+' (toll-free, 24/7).'); break;
    default: html=simplePage('Page not found','The page you\'re looking for doesn\'t exist.'); break;
  }
  $('#app').innerHTML=html;
  if(!render._scrolled || render._lastRoute!==route){ scrollTo(0,0); }
  render._lastRoute=route;
}
function renderKeepFocus(id){
  const el=document.getElementById(id); const pos=el?el.selectionStart:0;
  render();
  const n=document.getElementById(id);
  if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}
}
addEventListener('hashchange',()=>{
  try{ if(location.hash===CURRENT) return; CURRENT=location.hash||'#/'; }catch(e){}
  render();
});
/* Intercept every internal link so navigation works even when the iframe
   blocks hash writes — inline onclick handlers run before this and still apply. */
document.addEventListener('click',(e)=>{
  const a=e.target.closest('a[href^="#/"], a[href="#/"]');
  if(!a) return;
  e.preventDefault();
  go(a.getAttribute('href'));
});
addEventListener('scroll',()=>{$('#toTop').style.display=scrollY>500?'block':'none'},{passive:true});
render();
</script>
