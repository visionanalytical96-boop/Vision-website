# Run from the vision-analytical/ directory:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# No ports are published to the host - the only way in is through the
# `cloudflared` service, which tunnels to `nginx` over the internal Docker
# network. For local testing without Cloudflare, temporarily add a
# `ports: ["8080:80"]` entry to the nginx service below.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vision_analytical}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-vision_analytical}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vision_analytical} -d ${POSTGRES_DB:-vision_analytical}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot job: applies pending migrations, then runs the (idempotent)
  # seed script. Uses the `builder` stage because it still has the Prisma
  # CLI + full node_modules - the `app` image is a trimmed standalone build
  # that doesn't carry the CLI.
  migrate:
    build:
      context: ..
      target: builder
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vision_analytical}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vision_analytical}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    restart: "no"

  app:
    build:
      context: ..
      args:
        # Build-time: bakes the CSP and any client-side NEXT_PUBLIC_* usage.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://visionanalytical.co.in}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-vision_analytical}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vision_analytical}?schema=public
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Included by every location block in default.conf. Mounted separately
      # because nginx resolves `include` at load time inside the container.
      - ./nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    depends_on:
      - app
    expose:
      - "80"

  # Opt-in: only starts with `--profile tunnel`. Without the profile the stack
  # comes up on the host port from docker-compose.ports.yml instead, which is
  # how you try a new deployment without pointing a live domain at it.
  #
  # The token is interpolated with :- rather than :? because compose evaluates
  # every service's variables at parse time — a required-variable guard here
  # aborted `up` for the whole stack, including people who never wanted the
  # tunnel. cloudflared reports a missing token clearly enough on its own.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx

volumes:
  postgres-data:
  uploads:
