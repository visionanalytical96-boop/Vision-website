# Reverse proxy in front of the Next.js app. Cloudflare Tunnel terminates
# TLS at Cloudflare's edge and forwards plain HTTP to this container over
# the internal Docker network, so no cert handling happens here.

# TLS is terminated upstream, so $scheme is always "http" here. Next.js needs
# the *original* scheme to build absolute URLs and to validate Server Action
# requests, so pass through the upstream X-Forwarded-Proto when it exists.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Connection must be "upgrade" only for a real WebSocket handshake. Sending it
# on every request tells the upstream — and every proxy in between, including
# cloudflared — that a protocol switch is coming when none is, which breaks
# keep-alive and can truncate ordinary responses.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# upgrade-insecure-requests, but only when the browser really is on https.
#
# The directive tells the browser to re-fetch every subresource over https. On
# a page served over plain http that is fatal: every CSS/JS/font request goes
# to a port nothing serves and the page renders completely unstyled, while
# curl still reports 200 for those exact files because curl ignores CSP.
#
# It cannot be decided at build time — the same image answers the public https
# domain, the LAN IP over http, and localhost health probes. $forwarded_proto
# is the browser's actual scheme (X-Forwarded-Proto from Cloudflare, falling
# back to $scheme). nginx omits an add_header whose value is empty, so http
# requests simply do not get the directive.
map $forwarded_proto $csp_upgrade_insecure {
    https   "upgrade-insecure-requests";
    default "";
}

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
# Without this, `gzip on` does nothing here: nginx skips compression for
# responses that came from a proxy unless told otherwise, and every response
# this server returns is proxied. `any` because the upstream is our own app.
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

server {
    listen 80;
    server_name _;

    # Matches the app's own upload cap (8MB image) plus form overhead.
    client_max_body_size 10m;

    include /etc/nginx/snippets/security-headers.conf;

    location /_next/static/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";

        # Next.js already sends its own Cache-Control here. Without hiding it
        # first, add_header appends rather than replaces and the response goes
        # out with two Cache-Control headers — which caches, including
        # Cloudflare's edge, are free to resolve differently from each other.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /uploads/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
