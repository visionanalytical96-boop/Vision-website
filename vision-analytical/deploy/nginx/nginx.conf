# Reverse proxy in front of the Next.js app. Cloudflare Tunnel terminates
# TLS at Cloudflare's edge and forwards plain HTTP to this container over
# the internal Docker network, so no cert handling happens here.

# TLS is terminated upstream, so $scheme is always "http" here. Next.js needs
# the *original* scheme to build absolute URLs and to validate Server Action
# requests, so pass through the upstream X-Forwarded-Proto when it exists.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

server {
    listen 80;
    server_name _;

    # Matches the app's own upload cap (8MB image) plus form overhead.
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /_next/static/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $http_host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $http_host;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
