# Security headers, included by every location block.
#
# nginx's add_header does NOT merge across levels: a location that declares
# any add_header of its own silently discards every add_header inherited from
# the server block. The static-asset locations set Cache-Control, so before
# this file existed they were dropping all four of these. Including the same
# file in each location is the only way to keep them consistent.
#
# Must stay in step with next.config.ts, which sets the same headers. nginx is
# closer to the browser, so where they disagree, nginx wins.

# The app sets these too. Without hiding the upstream copy, add_header appends
# and the response carries two of each — and where the two disagree (an older
# app image saying geolocation=() while nginx says geolocation=(self)) the
# browser resolves it the restrictive way, silently disabling the feature.
# nginx is closer to the browser, so nginx's copy is the one that ships.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# geolocation=(self): the engineer portal records where a check-in happened.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

# A second policy carrying only upgrade-insecure-requests, added only on https
# (see the $csp_upgrade_insecure map). Multiple CSP headers are enforced
# together, and a policy with no fetch directives restricts nothing else — so
# this hardens https without touching the main policy. Empty on http, and
# nginx omits an add_header whose value is empty.
add_header Content-Security-Policy $csp_upgrade_insecure always;
