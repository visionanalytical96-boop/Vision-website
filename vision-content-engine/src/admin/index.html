<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Content Studio — Vision Analytical</title>
<style>
@font-face{font-family:'Syne';src:url(/assets/fonts/Syne-700.woff2) format('woff2');font-weight:700 800;font-display:swap}
@font-face{font-family:'Space Grotesk';src:url(/assets/fonts/Space-Grotesk-400.woff2) format('woff2');font-weight:300 700;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(/assets/fonts/JetBrains-Mono-400.woff2) format('woff2');font-weight:400 500;font-display:swap}
:root{
  --bg:#040608; --bg2:#080d12; --surface:rgba(255,255,255,.035); --surface2:rgba(255,255,255,.06);
  --border:rgba(0,229,255,.14); --border2:rgba(0,229,255,.3);
  --blue:#2563EB; --cyan:#00E5FF; --white:#F0F4FF;
  --muted:rgba(240,244,255,.48); --muted2:rgba(240,244,255,.7);
  --green:#22c55e; --amber:#f59e0b; --red:#ef4444;
  --display:'Syne',system-ui,sans-serif; --body:'Space Grotesk',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--white);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--cyan);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}

/* layout */
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
aside{background:var(--bg2);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;padding:0 8px 2px}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:.6rem;letter-spacing:.22em;color:var(--cyan)}
nav{margin-top:26px;display:flex;flex-direction:column;gap:2px}
nav button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:8px;color:var(--muted2);cursor:pointer;font-size:.85rem}
nav button:hover{background:var(--surface);color:var(--white)}
nav button.on{background:var(--surface2);color:var(--white);box-shadow:inset 2px 0 0 var(--cyan)}
main{padding:26px 30px 60px;max-width:1500px;overflow:hidden}
h1{font-family:var(--display);font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
h2{font-family:var(--display);font-size:1.05rem;font-weight:700;margin-bottom:12px}
.sub{color:var(--muted);font-size:.85rem;margin-top:3px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}

/* primitives */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.stat .n{font-family:var(--display);font-size:1.9rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .l{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.13em;margin-top:5px}
.btn{background:var(--cyan);color:#04121a;border:0;border-radius:7px;padding:8px 14px;font-weight:700;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;border:1px solid var(--border2);color:var(--cyan)}
.btn.sm{padding:5px 10px;font-size:.68rem}
.btn.danger{background:none;border:1px solid rgba(239,68,68,.5);color:var(--red)}
label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:.86rem}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--border2)}
textarea{min-height:74px;resize:vertical;font-family:var(--mono);font-size:.78rem}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th{text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
td .row{flex-wrap:nowrap}
tr:hover td{background:rgba(255,255,255,.02)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border:1px solid}
.pill.ok{color:var(--green);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1)}
.pill.warn{color:var(--amber);border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.1)}
.pill.bad{color:var(--red);border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.1)}
.pill.mut{color:var(--muted2);border-color:var(--border)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.mono{font-family:var(--mono);font-size:.76rem;color:var(--muted2)}
.empty{color:var(--muted);text-align:center;padding:40px 16px;font-size:.86rem}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* preview */
.preview{background:repeating-conic-gradient(#0a0f14 0 25%,#0d141b 0 50%) 0 0/22px 22px;border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:center;padding:14px;min-height:340px}
.preview img,.preview object{max-width:100%;max-height:66vh;border-radius:5px;display:block}
.thumb{width:54px;height:54px;object-fit:cover;border-radius:6px;background:#0a0f14;border:1px solid var(--border)}

/* toast + modal */
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:390px}
.toast{background:#0c1219;border:1px solid var(--border2);border-left:3px solid var(--cyan);border-radius:8px;padding:11px 14px;font-size:.83rem;box-shadow:0 12px 34px rgba(0,0,0,.6)}
.toast.err{border-left-color:var(--red);border-color:rgba(239,68,68,.4)}
.modal{position:fixed;inset:0;background:rgba(2,4,6,.82);display:flex;align-items:center;justify-content:center;padding:22px;z-index:50}
.modal .card{max-width:960px;width:100%;max-height:92vh;overflow:auto;background:#080d12}

/* login */
.login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login .card{max-width:370px;width:100%}
.hide{display:none}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}nav{flex-direction:row;flex-wrap:wrap;margin:0}main{padding:18px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>

<script>
/* ------------------------------------------------------------------ *
 * Tiny helpers — no framework, no build step.
 * ------------------------------------------------------------------ */
const $ = (s, r = document) => r.querySelector(s);
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtDate = (v) => v ? new Date(v.includes('T') ? v : v.replace(' ', 'T') + 'Z').toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' }) : '—';

function toast(message, isError = false) {
  const el = h(`<div class="toast ${isError ? 'err' : ''}">${esc(message)}</div>`);
  $('#toast').append(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, isError ? 7000 : 3800);
}

async function api(path, { method = 'GET', body, raw = false } = {}) {
  const res = await fetch(path, {
    method,
    headers: body instanceof FormData ? {} : { 'Content-Type': 'application/json' },
    body: body instanceof FormData ? body : body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { state.user = null; render(); throw new Error('Session expired — please sign in again'); }
  if (raw) { if (!res.ok) throw new Error(await res.text()); return res.text(); }
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

const statusPill = (s) => {
  const map = { published:'ok', generated:'ok', scheduled:'warn', generating:'warn', publishing:'warn',
                draft:'mut', cancelled:'mut', failed:'bad', publishing_failed:'bad' };
  return `<span class="pill ${map[s] || 'mut'}">${esc(String(s).replace('_',' '))}</span>`;
};

const state = { user:null, view:'dashboard', cache:{} };

/* ------------------------------------------------------------------ *
 * Views
 * ------------------------------------------------------------------ */
const views = {};

views.dashboard = async (el) => {
  const d = await api('/api/dashboard');
  const next = d.content.nextScheduled;
  el.innerHTML = `
    <div class="head"><div><h1>Dashboard</h1><div class="sub">Rendering via ${esc(d.renderer.primary)} · ${esc(d.storage.human)} stored</div></div>
      <div class="row"><button class="btn" id="gen">Generate Now</button><button class="btn ghost" id="run">Run Scheduler</button></div></div>
    <div class="grid g4">
      ${[['Templates',d.templates.total,`${d.templates.active} active`],
         ['Products',d.products.total,`${d.products.published} published`],
         ['Scheduled',d.content.scheduled,'awaiting generation'],
         ['Published Today',d.content.publishedToday,`${d.content.publishedThisMonth} this month`],
         ['Generated Images',d.content.generated,'total'],
         ['Failed Jobs',d.content.failed,'need attention'],
         ['Storage',d.storage.human,`${d.storage.files} files`],
         ['Next Post',next ? fmtDate(next.scheduled_for) : '—', next ? next.title : 'nothing scheduled'],
        ].map(([l,n,s]) => `<div class="card stat"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div><div class="sub">${esc(s)}</div></div>`).join('')}
    </div>
    <div class="card" style="margin-top:16px">
      <div class="spread"><h2 style="margin:0">Automation</h2>
        <span class="pill ${d.schedule.enabled ? 'ok' : 'mut'}">${d.schedule.enabled ? 'Scheduler on' : 'Scheduler off'}</span></div>
      <div class="sub" style="margin-top:8px">
        ${d.schedule.enabled ? `Runs at ${esc((d.schedule.times||[]).join(', '))} (${esc(d.schedule.timezone)}).` : 'Turn the scheduler on under Settings to publish automatically.'}
        ${d.schedule.autoPublish && d.autoPublishAllowed
          ? ' Generated posts are <strong>published automatically</strong>.'
          : ' Generated posts wait for approval before publishing.'}
      </div>
    </div>`;
  $('#gen', el).onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = 'Generating…';
    try { const r = await api('/api/generate', { method:'POST', body:{} }); toast(`Generated "${r.content.title}"`); go('calendar'); }
    catch (err) { toast(err.message, true); e.target.disabled = false; e.target.textContent = 'Generate Now'; }
  };
  $('#run', el).onclick = async () => {
    try { const r = await api('/api/schedule/run', { method:'POST' });
      toast(`Scheduler ran — ${r.results.generated.length} generated, ${r.results.published.length} published`); }
    catch (err) { toast(err.message, true); }
  };
};

views.templates = async (el) => {
  const [{ templates }, { families }] = await Promise.all([api('/api/templates'), api('/api/formats')]);
  el.innerHTML = `
    <div class="head"><div><h1>Templates</h1><div class="sub">${templates.length} templates · ${families.length} layout families</div></div>
      <button class="btn" id="new">New Template</button></div>
    <div class="card" style="padding:0;overflow:auto">
      <table><thead><tr><th>Name</th><th>Family</th><th>Theme</th><th>Output</th><th>Used</th><th>Status</th><th></th></tr></thead><tbody>
      ${templates.map(t => `<tr>
        <td><strong>${esc(t.name)}</strong><div class="mono">${esc(t.slug)}</div></td>
        <td class="mono">${esc(t.family)}</td><td>${esc(t.theme)}</td>
        <td class="mono">${esc(t.format_preset || `${t.width}×${t.height}`)} · ${esc(t.output_format)}</td>
        <td>${t.usage_count}</td>
        <td><span class="pill ${t.active ? 'ok' : 'mut'}">${t.active ? 'active' : 'inactive'}</span></td>
        <td><div class="row">
          <button class="btn sm ghost" data-edit="${t.id}">Edit</button>
          <button class="btn sm ghost" data-dup="${t.id}">Duplicate</button>
          <button class="btn sm ghost" data-test="${t.id}">Test</button>
          <button class="btn sm danger" data-del="${t.id}">Delete</button>
        </div></td></tr>`).join('') || '<tr><td colspan="7" class="empty">No templates yet.</td></tr>'}
      </tbody></table></div>`;

  $('#new', el).onclick = () => templateEditor(null, families);
  el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => templateEditor(templates.find(t => t.id == b.dataset.edit), families));
  el.querySelectorAll('[data-dup]').forEach(b => b.onclick = async () => {
    try { await api(`/api/templates/${b.dataset.dup}/duplicate`, { method:'POST', body:{} }); toast('Template duplicated (starts inactive)'); go('templates'); }
    catch (e) { toast(e.message, true); } });
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete this template? Generated posts are kept.')) return;
    try { await api(`/api/templates/${b.dataset.del}`, { method:'DELETE' }); toast('Template deleted'); go('templates'); }
    catch (e) { toast(e.message, true); } });
  el.querySelectorAll('[data-test]').forEach(b => b.onclick = () => previewModal({ templateId: Number(b.dataset.test) }));
};

async function templateEditor(tpl, families) {
  const { presets, outputFormats } = await api('/api/formats');
  const t = tpl || { name:'', family:families[0], theme:'dark', description:'', config:{}, format_preset:'instagram-square', output_format:'png', active:1 };
  const modal = h(`<div class="modal"><div class="card">
    <div class="spread"><h2 style="margin:0">${tpl ? 'Edit' : 'New'} Template</h2><button class="btn sm ghost" id="x">Close</button></div>
    <div class="grid g2" style="margin-top:10px">
      <div>
        <label>Name</label><input id="name" value="${esc(t.name)}">
        <label>Layout family</label><select id="family">${families.map(f => `<option ${f===t.family?'selected':''}>${esc(f)}</option>`).join('')}</select>
        <label>Theme</label><select id="theme"><option ${t.theme==='dark'?'selected':''}>dark</option><option ${t.theme==='light'?'selected':''}>light</option></select>
        <label>Description</label><input id="description" value="${esc(t.description||'')}">
      </div>
      <div>
        <label>Output size</label><select id="preset">${presets.map(p => `<option value="${p.slug}" ${p.slug===t.format_preset?'selected':''}>${esc(p.name)} — ${p.width}×${p.height}</option>`).join('')}</select>
        <label>File format</label><select id="output">${outputFormats.map(f => `<option ${f===t.output_format?'selected':''}>${esc(f)}</option>`).join('')}</select>
        <label>Active</label><select id="active"><option value="1" ${t.active?'selected':''}>Active</option><option value="0" ${!t.active?'selected':''}>Inactive</option></select>
        <label>Configuration (JSON)</label><textarea id="config">${esc(JSON.stringify(t.config || {}, null, 2))}</textarea>
        <div class="sub">Keys: maxSpecs, ctaLabel, badgeLabel, showFeatures, maxFeatures, mediaWeight, background, imageTreatment, showPrice, showContact.</div>
      </div>
    </div>
    <div class="row" style="margin-top:16px"><button class="btn" id="save">Save</button>
      ${tpl ? '<button class="btn ghost" id="test">Test Generate</button>' : ''}</div>
  </div></div>`);
  document.body.append(modal);
  $('#x', modal).onclick = () => modal.remove();
  if (tpl) $('#test', modal).onclick = () => previewModal({ templateId: tpl.id });
  $('#save', modal).onclick = async () => {
    let config;
    try { config = JSON.parse($('#config', modal).value || '{}'); }
    catch { return toast('Configuration is not valid JSON', true); }
    const body = { name:$('#name',modal).value.trim(), family:$('#family',modal).value, theme:$('#theme',modal).value,
      description:$('#description',modal).value, formatPreset:$('#preset',modal).value,
      outputFormat:$('#output',modal).value, active:Number($('#active',modal).value), config };
    if (!body.name) return toast('A name is required', true);
    try {
      await api(tpl ? `/api/templates/${tpl.id}` : '/api/templates', { method: tpl ? 'PUT' : 'POST', body });
      toast(tpl ? 'Template saved' : 'Template created'); modal.remove(); go('templates');
    } catch (e) { toast(e.message, true); }
  };
}

views.products = async (el) => {
  const [{ products }, { categories }] = await Promise.all([api('/api/products'), api('/api/categories')]);
  const catName = (id) => categories.find(c => c.id === id)?.name ?? '—';
  el.innerHTML = `
    <div class="head"><div><h1>Product Library</h1><div class="sub">${products.length} items</div></div>
      <div class="row"><input id="q" placeholder="Search…" style="width:210px"><button class="btn" id="new">Add Product</button></div></div>
    <div class="card" style="padding:0;overflow:auto">
      <table><thead><tr><th></th><th>Product</th><th>Category</th><th>Stock</th><th>Published</th><th>Status</th><th></th></tr></thead><tbody id="rows">
      ${products.map(p => productRow(p, catName)).join('') || '<tr><td colspan="7" class="empty">No products yet.</td></tr>'}
      </tbody></table></div>`;

  const bind = () => {
    el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => productEditor(products.find(p => p.id == b.dataset.edit), categories));
    el.querySelectorAll('[data-gen]').forEach(b => b.onclick = () => previewModal({ productId: Number(b.dataset.gen) }));
    el.querySelectorAll('[data-arch]').forEach(b => b.onclick = async () => {
      try { await api(`/api/products/${b.dataset.arch}/archive`, { method:'POST' }); toast('Product archived'); go('products'); }
      catch (e) { toast(e.message, true); } });
  };
  bind();
  $('#new', el).onclick = () => productEditor(null, categories);
  $('#q', el).oninput = (e) => {
    const term = e.target.value.toLowerCase();
    const list = products.filter(p => `${p.name} ${p.brand} ${p.model} ${p.part_number}`.toLowerCase().includes(term));
    $('#rows', el).innerHTML = list.map(p => productRow(p, catName)).join('') || '<tr><td colspan="7" class="empty">No matches.</td></tr>';
    bind();
  };
};

const productRow = (p, catName) => `<tr>
  <td>${p.images?.length ? `<img class="thumb" src="/media/${esc(p.images[0])}" alt="">` : '<div class="thumb"></div>'}</td>
  <td><strong>${esc(p.name)}</strong><div class="mono">${esc([p.brand,p.model].filter(Boolean).join(' · '))}</div></td>
  <td>${esc(catName(p.category_id))}</td><td>${esc(p.stock_status || '—')}</td>
  <td>${p.publish_count}${p.last_published_at ? `<div class="mono">${esc(fmtDate(p.last_published_at))}</div>` : ''}</td>
  <td><span class="pill ${p.status === 'published' ? 'ok' : 'mut'}">${esc(p.status)}</span></td>
  <td><div class="row"><button class="btn sm ghost" data-edit="${p.id}">Edit</button>
    <button class="btn sm ghost" data-gen="${p.id}">Generate</button>
    <button class="btn sm danger" data-arch="${p.id}">Archive</button></div></td></tr>`;

async function productEditor(product, categories) {
  const p = product || { name:'', status:'draft', specifications:[], features:[], applications:[], compatible_with:[], images:[] };
  const listVal = (v) => Array.isArray(v) ? v.map(x => typeof x === 'string' ? x : `${x.label}: ${x.value}`).join('\n') : '';
  const F = (id, label, val = '') => `<label>${label}</label><input id="${id}" value="${esc(val)}">`;
  const modal = h(`<div class="modal"><div class="card">
    <div class="spread"><h2 style="margin:0">${product ? 'Edit' : 'New'} Product</h2><button class="btn sm ghost" id="x">Close</button></div>
    <div class="grid g3" style="margin-top:10px">
      <div>
        ${F('name','Product name',p.name)}${F('brand','Brand',p.brand)}${F('model','Model',p.model)}
        <label>Category</label><select id="category">${categories.map(c => `<option value="${c.id}" ${c.id===p.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
        <label>Status</label><select id="status"><option ${p.status==='draft'?'selected':''}>draft</option><option ${p.status==='published'?'selected':''}>published</option></select>
        <label>Description</label><textarea id="description">${esc(p.description||'')}</textarea>
      </div>
      <div>
        ${F('condition','Condition',p.condition)}${F('year','Year',p.year)}${F('configuration','Configuration',p.configuration)}
        ${F('detector','Detector',p.detector)}${F('pump','Pump',p.pump)}${F('autosampler','Autosampler',p.autosampler)}
        ${F('software','Software',p.software)}${F('warranty','Warranty',p.warranty)}${F('partNumber','Part number',p.part_number)}
      </div>
      <div>
        ${F('price','Price',p.price)}${F('priceType','Price type',p.price_type)}${F('stockStatus','Stock status',p.stock_status)}
        <label>Specifications (one per line, "Label: Value")</label><textarea id="specifications">${esc(listVal(p.specifications))}</textarea>
        <label>Features (one per line)</label><textarea id="features">${esc(listVal(p.features))}</textarea>
        <label>Applications / compatible with (one per line)</label><textarea id="applications">${esc(listVal(p.applications))}</textarea>
      </div>
    </div>
    ${product ? `<div style="margin-top:14px"><label>Product images</label>
      <div class="row" id="imgs">${(p.images||[]).map((k,i) => `<div style="position:relative"><img class="thumb" src="/media/${esc(k)}" alt=""><button class="btn sm danger" data-rmimg="${i}" style="position:absolute;top:-6px;right:-6px;padding:1px 6px">×</button></div>`).join('') || '<span class="sub">None uploaded</span>'}</div>
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" multiple style="margin-top:9px">
      <div class="sub">PNG, JPEG, WebP or SVG. A cut-out on a transparent background gives the best result.</div></div>` : ''}
    <div class="row" style="margin-top:16px"><button class="btn" id="save">Save</button>
      ${product ? '<button class="btn ghost" id="gen">Preview &amp; Generate</button>' : ''}</div>
  </div></div>`);
  document.body.append(modal);
  $('#x', modal).onclick = () => modal.remove();

  const lines = (id) => $(`#${id}`, modal).value.split('\n').map(s => s.trim()).filter(Boolean);
  const collect = () => ({
    name:$('#name',modal).value.trim(), brand:$('#brand',modal).value, model:$('#model',modal).value,
    category_id:Number($('#category',modal).value), status:$('#status',modal).value,
    description:$('#description',modal).value, condition:$('#condition',modal).value, year:$('#year',modal).value,
    configuration:$('#configuration',modal).value, detector:$('#detector',modal).value, pump:$('#pump',modal).value,
    autosampler:$('#autosampler',modal).value, software:$('#software',modal).value, warranty:$('#warranty',modal).value,
    part_number:$('#partNumber',modal).value, price:$('#price',modal).value, price_type:$('#priceType',modal).value,
    stock_status:$('#stockStatus',modal).value,
    specifications:lines('specifications').map(l => { const i = l.indexOf(':'); return i === -1 ? { label:'Spec', value:l } : { label:l.slice(0,i).trim(), value:l.slice(i+1).trim() }; }),
    features:lines('features'), applications:lines('applications'), compatible_with:lines('applications'),
  });

  $('#save', modal).onclick = async () => {
    const body = collect();
    if (!body.name) return toast('A product name is required', true);
    try {
      const saved = await api(product ? `/api/products/${product.id}` : '/api/products', { method: product ? 'PUT' : 'POST', body });
      const id = saved.product.id;
      const files = product ? $('#file', modal).files : null;
      if (files?.length) {
        const fd = new FormData();
        for (const f of files) fd.append('image', f);
        await api(`/api/products/${id}/images`, { method:'POST', body: fd });
      }
      toast(product ? 'Product saved' : 'Product created'); modal.remove(); go('products');
    } catch (e) { toast(e.message, true); }
  };
  if (product) {
    $('#gen', modal).onclick = () => { modal.remove(); previewModal({ productId: product.id }); };
    modal.querySelectorAll('[data-rmimg]').forEach(b => b.onclick = async () => {
      try { await api(`/api/products/${product.id}/images/${b.dataset.rmimg}`, { method:'DELETE' }); toast('Image removed'); modal.remove(); go('products'); }
      catch (e) { toast(e.message, true); } });
  }
}

/** Live preview: renders SVG server-side, then generates the real file. */
async function previewModal(seed = {}) {
  const [{ products }, { templates }, { presets, outputFormats }] = await Promise.all([
    api('/api/products'), api('/api/templates'), api('/api/formats')]);
  const active = templates.filter(t => t.active);
  if (!products.length) return toast('Add a product first', true);
  if (!active.length) return toast('Activate a template first', true);

  const modal = h(`<div class="modal"><div class="card">
    <div class="spread"><h2 style="margin:0">Preview &amp; Generate</h2><button class="btn sm ghost" id="x">Close</button></div>
    <div class="grid" style="grid-template-columns:300px 1fr;margin-top:10px;align-items:start">
      <div>
        <label>Product</label><select id="p">${products.map(p => `<option value="${p.id}" ${p.id===seed.productId?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
        <label>Template</label><select id="t">${active.map(t => `<option value="${t.id}" ${t.id===seed.templateId?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
        <label>Size</label><select id="f"><option value="">Template default</option>${presets.map(p => `<option value="${p.slug}">${esc(p.name)}</option>`).join('')}</select>
        <label>File format</label><select id="o"><option value="">Template default</option>${outputFormats.map(f => `<option>${esc(f)}</option>`).join('')}</select>
        <label>Headline override</label><input id="title" placeholder="(use product name)">
        <label>CTA override</label><input id="cta" placeholder="(use template default)">
        <div class="row" style="margin-top:15px">
          <button class="btn ghost" id="refresh">Refresh</button>
          <button class="btn" id="make">Generate</button>
          <button class="btn ghost" id="makepub">Generate &amp; Publish</button>
        </div>
        <div class="sub" id="note" style="margin-top:10px">Preview is vector; Generate writes the final image.</div>
      </div>
      <div class="preview" id="stage"><span class="sub">Loading preview…</span></div>
    </div></div></div>`);
  document.body.append(modal);
  $('#x', modal).onclick = () => modal.remove();

  const opts = () => ({
    productId:Number($('#p',modal).value), templateId:Number($('#t',modal).value),
    formatPreset:$('#f',modal).value || undefined, outputFormat:$('#o',modal).value || undefined,
    overrides:{ ...( $('#title',modal).value ? { title:$('#title',modal).value } : {}),
                ...( $('#cta',modal).value ? { cta:$('#cta',modal).value } : {}) },
  });

  const refresh = async () => {
    const stage = $('#stage', modal);
    stage.innerHTML = '<span class="sub">Rendering…</span>';
    try {
      const svg = await api('/api/preview', { method:'POST', body:opts(), raw:true });
      const url = URL.createObjectURL(new Blob([svg], { type:'image/svg+xml' }));
      stage.innerHTML = ''; stage.append(h(`<img src="${url}" alt="Preview">`));
    } catch (e) { stage.innerHTML = `<span class="sub">${esc(e.message)}</span>`; }
  };
  ['p','t','f','o'].forEach(id => $(`#${id}`, modal).onchange = refresh);
  $('#refresh', modal).onclick = refresh;

  const doGenerate = async (publish) => {
    const btn = publish ? $('#makepub', modal) : $('#make', modal);
    btn.disabled = true; const label = btn.textContent; btn.textContent = 'Working…';
    try {
      const r = await api('/api/generate', { method:'POST', body:{ ...opts(), publish } });
      toast(publish ? `Published "${r.content.title}"` : `Generated "${r.content.title}"`);
      const warnings = r.validation?.warnings ?? [];
      if (warnings.length) toast(`Note: ${warnings.join('; ')}`);
      modal.remove(); go('calendar');
    } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = label; }
  };
  $('#make', modal).onclick = () => doGenerate(false);
  $('#makepub', modal).onclick = () => doGenerate(true);
  refresh();
}

views.calendar = async (el) => {
  const { content } = await api('/api/content?limit=300');
  el.innerHTML = `
    <div class="head"><div><h1>Content Calendar</h1><div class="sub">${content.length} items</div></div>
      <button class="btn" id="new">Generate Now</button></div>
    <div class="card" style="padding:0;overflow:auto">
      <table><thead><tr><th></th><th>Title</th><th>When</th><th>Size</th><th>Status</th><th></th></tr></thead><tbody>
      ${content.map(c => `<tr>
        <td>${c.imageUrl ? `<img class="thumb" src="${esc(c.imageUrl)}" alt="">` : '<div class="thumb"></div>'}</td>
        <td><strong>${esc(c.title)}</strong><div class="mono">${esc(c.origin)}${c.error ? ` · ${esc(c.error.slice(0,70))}` : ''}</div></td>
        <td class="mono">${esc(fmtDate(c.published_at || c.scheduled_for || c.generated_at || c.created_at))}</td>
        <td class="mono">${c.width}×${c.height} ${esc(c.output_format)}</td>
        <td>${statusPill(c.status)}</td>
        <td><div class="row">
          ${c.imageUrl ? `<button class="btn sm ghost" data-view="${esc(c.imageUrl)}">View</button>` : ''}
          ${c.status !== 'published' && c.file_name ? `<button class="btn sm" data-pub="${c.id}">Publish</button>` : ''}
          ${c.status === 'publishing_failed' ? `<button class="btn sm" data-retry="${c.id}">Retry</button>` : ''}
          ${c.status === 'failed' ? `<button class="btn sm" data-regen="${c.id}">Regenerate</button>` : ''}
          <button class="btn sm ghost" data-sched="${c.id}">Schedule</button>
          <button class="btn sm danger" data-del="${c.id}">Delete</button>
        </div></td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nothing generated yet.</td></tr>'}
      </tbody></table></div>`;

  $('#new', el).onclick = () => previewModal({});
  el.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
    const m = h(`<div class="modal"><div class="card"><div class="spread"><h2 style="margin:0">Preview</h2><button class="btn sm ghost">Close</button></div>
      <div class="preview" style="margin-top:10px"><img src="${esc(b.dataset.view)}" alt=""></div></div></div>`);
    document.body.append(m); m.querySelector('button').onclick = () => m.remove();
  });
  const act = async (id, path, msg) => { try { await api(`/api/content/${id}/${path}`, { method:'POST' }); toast(msg); go('calendar'); } catch (e) { toast(e.message, true); } };
  el.querySelectorAll('[data-pub]').forEach(b => b.onclick = () => act(b.dataset.pub, 'publish', 'Published'));
  el.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => act(b.dataset.retry, 'retry', 'Retried'));
  el.querySelectorAll('[data-regen]').forEach(b => b.onclick = () => act(b.dataset.regen, 'regenerate', 'Regenerated'));
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete this record? The generated image file is kept.')) return;
    try { await api(`/api/content/${b.dataset.del}`, { method:'DELETE' }); toast('Record deleted'); go('calendar'); }
    catch (e) { toast(e.message, true); } });
  el.querySelectorAll('[data-sched]').forEach(b => b.onclick = async () => {
    const when = prompt('Schedule for (YYYY-MM-DD HH:MM):');
    if (!when) return;
    const iso = new Date(when.replace(' ', 'T')).toISOString();
    try { await api(`/api/content/${b.dataset.sched}/schedule`, { method:'POST', body:{ scheduledFor: iso } }); toast('Scheduled'); go('calendar'); }
    catch (e) { toast(e.message, true); } });
};

    <div class="head"><div><h1>Settings</h1><div class="sub">Branding, automation and rotation</div></div></div>
    <div class="grid g2">
      <div class="card"><h2>Schedule</h2>
        <label>Enabled</label><select id="s-en"><option value="1" ${schedule.enabled?'selected':''}>On</option><option value="0" ${!schedule.enabled?'selected':''}>Off</option></select>
        <label>Times (comma separated, HH:MM)</label><input id="s-times" value="${esc((schedule.times||[]).join(', '))}">
        <label>Timezone</label><input id="s-tz" value="${esc(schedule.timezone)}">
        <label>Posts per run</label><input id="s-ppd" type="number" min="1" max="10" value="${schedule.postsPerDay}">
        <label>Days</label><div class="row">${days.map((d,i) => `<label style="margin:0;text-transform:none;letter-spacing:0"><input type="checkbox" data-day="${i}" ${schedule.days.includes(i)?'checked':''} style="width:auto"> ${d}</label>`).join('')}</div>
        <label>Publish automatically</label><select id="s-auto"><option value="1" ${schedule.autoPublish?'selected':''}>Yes</option><option value="0" ${!schedule.autoPublish?'selected':''}>No — hold for approval</option></select>
        ${autoPublishAllowed ? '' : '<div class="sub">Server-side auto-publishing is disabled. Set CONTENT_ENGINE_AUTO_PUBLISH=true to allow it.</div>'}
        <div class="row" style="margin-top:14px"><button class="btn" id="s-save">Save Schedule</button></div>
      </div>
      <div class="card"><h2>Rotation</h2>
        <label>Do not repeat a combination for (days)</label><input id="r-days" type="number" min="0" max="365" value="${rotation.windowDays}">
        <label>Rotate categories</label><select id="r-cat"><option value="1" ${rotation.categoryRotation?'selected':''}>Yes</option><option value="0" ${!rotation.categoryRotation?'selected':''}>No</option></select>
        <label>Rotate templates</label><select id="r-tpl"><option value="1" ${rotation.templateRotation?'selected':''}>Yes</option><option value="0" ${!rotation.templateRotation?'selected':''}>No</option></select>
        <div class="sub" style="margin-top:10px">${categories.length} categories configured.</div>
        <div class="row" style="margin-top:14px"><button class="btn" id="r-save">Save Rotation</button></div>
      </div>
      <div class="card"><h2>Brand</h2>
        <label>Name</label><input id="b-name" value="${esc(branding.name)}">
        <label>Tagline</label><input id="b-tag" value="${esc(branding.tagline)}">
        <label>Phone</label><input id="b-phone" value="${esc(branding.contact.phone)}">
        <label>Email</label><input id="b-email" value="${esc(branding.contact.email)}">
        <label>Website</label><input id="b-web" value="${esc(branding.contact.website)}">
        <label>Accent colour</label><input id="b-accent" value="${esc(branding.colors.accent)}">
        <label>Primary colour</label><input id="b-primary" value="${esc(branding.colors.primary)}">
        <div class="row" style="margin-top:14px"><button class="btn" id="b-save">Save Brand</button></div>
      </div>
    </div>`;

  $('#s-save', el).onclick = async () => {
    const body = { enabled:$('#s-en',el).value === '1',
      times:$('#s-times',el).value.split(',').map(s => s.trim()).filter(Boolean),
      timezone:$('#s-tz',el).value.trim(), postsPerDay:Number($('#s-ppd',el).value),
      days:[...el.querySelectorAll('[data-day]')].filter(c => c.checked).map(c => Number(c.dataset.day)),
      autoPublish:$('#s-auto',el).value === '1' };
    try { await api('/api/schedule', { method:'PUT', body }); toast('Schedule saved'); } catch (e) { toast(e.message, true); }
  };
  $('#r-save', el).onclick = async () => {
    try { await api('/api/settings/rotation', { method:'PUT', body:{ windowDays:Number($('#r-days',el).value),
      categoryRotation:$('#r-cat',el).value === '1', templateRotation:$('#r-tpl',el).value === '1' } });
      toast('Rotation saved'); } catch (e) { toast(e.message, true); }
  };
  $('#b-save', el).onclick = async () => {
    const body = { ...branding, name:$('#b-name',el).value, tagline:$('#b-tag',el).value,
      contact:{ ...branding.contact, phone:$('#b-phone',el).value, email:$('#b-email',el).value, website:$('#b-web',el).value },
      colors:{ ...branding.colors, accent:$('#b-accent',el).value, primary:$('#b-primary',el).value } };

  };
};

views.logs = async (el) => {
  const { logs } = await api('/api/logs?limit=200');

    <div class="card" style="padding:0;overflow:auto">

/* ------------------------------------------------------------------ *
 * Shell
 * ------------------------------------------------------------------ */
const NAV = [['dashboard','Dashboard'],['templates','Templates'],['products','Products'],
             ['calendar','Calendar'],['settings','Settings'],['logs','Logs']];

function go(view) { state.view = view; render(); }

async function render() {
  const root = $('#root');
  if (!state.user) {
    root.innerHTML = `<div class="login"><form class="card" id="lf">
      <div class="brand">VISION<small>ANALYTICAL</small></div>
      <h2 style="margin-top:18px">Content Studio</h2>
      <label>Email</label><input id="email" type="email" autocomplete="username" required>
      <label>Password</label><input id="password" type="password" autocomplete="current-password" required>
      <button class="btn" style="width:100%;margin-top:18px" type="submit">Sign In</button>
    </form></div>`;
    $('#lf').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const r = await api('/api/auth/login', { method:'POST', body:{ email:$('#email').value, password:$('#password').value } });
        state.user = r.user; state.view = 'dashboard'; render();
      } catch (err) { toast(err.message, true); }
    };
    return;
  }

  root.innerHTML = `<div class="app">
    <aside><div class="brand">VISION<small>ANALYTICAL</small></div>
      <nav>${NAV.map(([k,l]) => `<button data-nav="${k}" class="${state.view===k?'on':''}">${l}</button>`).join('')}</nav>
      <div style="margin-top:auto;padding-top:22px">
        <div class="sub" style="padding:0 8px">${esc(state.user.email || 'API session')}</div>
        <button class="btn sm ghost" id="out" style="margin:8px 8px 0">Sign out</button></div>
    </aside>
    <main id="main"><div class="empty">Loading…</div></main></div>`;

  root.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));
  $('#out').onclick = async () => { await api('/api/auth/logout', { method:'POST' }); state.user = null; render(); };

  const main = $('#main');
  try { await views[state.view](main); }
  catch (e) { main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

api('/api/auth/me').then(r => { state.user = r.user; render(); }).catch(() => render());
</script>
